services:
  - type: web
    name: fastapi-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PORT
        value: 10000

  - type: web
    name: frontend-app
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run preview -- --port 3000
    staticPublishPath: ./dist
    envVars:
      - key: PORT
        value: 3000
