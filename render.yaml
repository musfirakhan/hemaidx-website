services:
  - type: web
    name: fastapi-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PORT
        value: 8000

  - type: web
    name: frontend-app
    env: node
    buildCommand: npm install 
    startCommand: npm run dev
    staticPublishPath: ./dist
    envVars:
      - key: PORT
        value: 5137
